[package]
name = "devwidgets"
version = "1.0.0"
description = "Windows Desktop Productivity Widgets for GitHub & LeetCode"
authors = ["DevWidgets Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-autostart = "2.0.0"
tauri-plugin-store = "2.0.0"
